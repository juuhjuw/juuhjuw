name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: juuhjuw
          outputs: snake.svg

      - name: Commit snake.svg
        uses: EndBug/add-and-commit@v9
        with:
          add: snake.svg
          message: "Update snake animation"
